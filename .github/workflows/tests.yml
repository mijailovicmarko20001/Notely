name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel a stale run when new commits land on the same PR/branch, rather than
# letting redundant runs pile up and race for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default token scope is read-only; nothing in this workflow needs to write
# to the repo, so don't grant it more than that.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # requirements.txt (runtime) + the [dev] extra (pytest/httpx/anyio) --
      # not the arm64-dev-machine requirements-lock.txt: the test suite is
      # pure-Python logic against synthetic fixtures/stub scripts, never
      # shells out to ffmpeg/tesseract/yt-dlp, so no system packages are
      # needed here -- see tests/webui/conftest.py and
      # tests/test_jobs_scheduler.py's module docstrings.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q
